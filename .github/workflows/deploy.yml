name: Deploy

# Socket-mode Slack bot — single instance, deployed from main.
# (No dev/prod split: two socket-mode bots on the same tokens would split
# Slack events unpredictably.)

on:
  push:
    branches: [main]

# One run at a time per branch, build and deploy together: a newer push waits for the running one instead
# of cancelling it. What a cancel does to a deploy: vps DEPLOY.md, "One deploy at a time per deployment".
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Only main builds. A workflow_dispatch (or any trigger) from another branch would otherwise
    # push a tag the deploy job then can't deploy (the vps environment allows only main and prod), leaving
    # that tag on an undeployed image for the next deploy to ship.
    if: github.ref == 'refs/heads/main'   # full ref: a tag named main doesn't match
    runs-on: ubuntu-latest
    timeout-minutes: 30      # a hung build would otherwise hold the branch's deploy queue for GitHub's 6 hours
    permissions:
      contents: read
      packages: write        # required: GITHUB_TOKEN is read-only by default, can't push to GHCR without this
    # Every action pinned by full commit SHA: this job can push the tag the gate deploys, so a re-pointed
    # tag on any of them could ship a substituted image. Bump a pin only after reading its diff.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          provenance: false

  # The deploy key lives only in this job, a reusable workflow that a calling job can't add steps to. The
  # server picks the image and migration; this job names the deployment (vps DEPLOY.md, "How a deploy reaches the server").
  deploy:
    needs: build
    permissions:
      contents: read
      packages: read         # the server pulls the image with this run's token
    uses: tayl0r/vps-deploy/.github/workflows/deploy.yml@61ad38c841556dbd1c2d9e743d9659d6591a1d2f # v2.0.0
    with:
      # The app's name in the vps app manifest (not the repo's); a literal, since there's no -dev.
      target: torrent-bot
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
      VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
