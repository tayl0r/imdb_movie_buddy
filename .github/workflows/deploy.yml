name: Deploy

# Socket-mode Slack bot — single instance, deployed from main.
# (No dev/prod split: two socket-mode bots on the same tokens would split
# Slack events unpredictably.)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          provenance: false

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          # Calls the shared VPS deploy script (source: tayl0r/vps deploy/app-deploy.sh,
          # installed at /opt/apps/deploy.sh). It owns isolated GHCR login, single-pull
          # -with-retry, and `up --pull never` — see vps DEPLOY.md § "The shared deploy
          # script". Single-env, single image, no DB migrate → static args.
          script: |
            export GITHUB_TOKEN GITHUB_ACTOR
            /opt/apps/deploy.sh torrent-bot "ghcr.io/${{ github.repository }}:latest"
